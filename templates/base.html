<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyah-Chan Admin</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
<header>
    <div class="header-inner">
        <a href="/ui/dashboard" class="logo">
            <div class="logo-icon">N</div>
            <div class="logo-text">Nyah<span>-Chan</span></div>
        </a>
        <nav>
            <a href="/ui/dashboard" class="{% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/ui/keywords" class="{% if active == 'keywords' %}active{% endif %}">Keywords</a>
            <a href="/ui/roles" class="{% if active == 'roles' %}active{% endif %}">Rôles</a>
            <a href="/ui/grant" class="{% if active == 'grant' %}active{% endif %}">Grant</a>
            <a href="/ui/warnings" class="{% if active == 'warnings' %}active{% endif %}">Warnings</a>
            <div class="nav-actions">
                <button type="button" class="btn btn-secondary btn-sm" onclick="reloadConfigs()">🔄 Reload</button>
                <a href="/logout" class="btn btn-ghost btn-sm">Déconnexion</a>
            </div>
        </nav>
    </div>
</header>

<div class="toast-container" id="toast-container"></div>

<main>
    {% block content %}{% endblock %}
</main>

<script>
// --- Toast system ---
function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    const icons = { success: '✅', error: '❌', info: 'ℹ️' };
    toast.innerHTML = `
        <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
        <span>${escapeHtml(String(message))}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">×</button>
    `;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
    }, 4000);
}

// --- Reload configs ---
async function reloadConfigs() {
    try {
        const resp = await fetch('/api/reload', { method: 'POST' });
        if (resp.status === 303 || resp.redirected) {
            window.location.href = '/login';
            return;
        }
        const data = await resp.json();
        if (data.ok) {
            showToast('Configurations rechargées avec succès', 'success');
        } else {
            showToast('Erreur: ' + (data.error || 'inconnue'), 'error');
        }
    } catch (e) {
        showToast('Erreur réseau: ' + e, 'error');
    }
}

// --- Helper: authenticated fetch (auto-redirect on session expiry) ---
async function authFetch(url, options = {}) {
    const resp = await fetch(url, options);
    if (resp.status === 303 || resp.status === 401 || resp.redirected) {
        window.location.href = '/login';
        return null;
    }
    return resp;
}

// --- Helper: escape HTML to prevent XSS ---
function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}
</script>
</body>
</html>
