{% extends "base.html" %}
{% block title %}Keywords — Nyah-Chan{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Keyword Responses</h1>
    <p>Réponses automatiques par mots-clés</p>
</div>

<div class="card">
    <div class="card-header">
        <h2>Liste des keywords</h2>
        <button class="btn btn-primary btn-sm" onclick="addKeyword()">+ Ajouter</button>
    </div>
    <div id="kw-list"></div>
    <div class="btn-group">
        <button class="btn btn-success" onclick="saveKeywords()">Sauvegarder</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let keywords = [];

async function load() {
    const res = await authFetch('/api/keywords');
    if (!res) return;
    keywords = await res.json();
    render();
}

function render() {
    const el = document.getElementById('kw-list');
    if (!keywords.length) {
        el.innerHTML = '<div class="empty-state"><p>Aucun keyword configuré.</p></div>';
        return;
    }
    el.innerHTML = keywords.map((kw, i) => `
        <div class="card" style="margin-bottom:0.75rem">
            <div class="form-row">
                <div class="form-group">
                    <label>Triggers (virgule séparés)</label>
                    <input type="text" value="${(kw.triggers||[]).join(', ')}"
                        onchange="keywords[${i}].triggers = this.value.split(',').map(s=>s.trim()).filter(Boolean)">
                </div>
                <div class="form-group">
                    <label>Titre</label>
                    <input type="text" value="${esc(kw.title||'')}" onchange="keywords[${i}].title=this.value">
                </div>
                <div class="form-group">
                    <label>Couleur</label>
                    <input type="text" value="${esc(kw.color||'')}" placeholder="#ff0000 ou red"
                        onchange="keywords[${i}].color=this.value">
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea rows="2" onchange="keywords[${i}].description=this.value">${esc(kw.description||'')}</textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Footer</label>
                    <input type="text" value="${esc(kw.footer||'')}" onchange="keywords[${i}].footer=this.value">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" value="${esc(kw.image_url||'')}" onchange="keywords[${i}].image_url=this.value">
                </div>
                <div class="form-group">
                    <label>Thumbnail URL</label>
                    <input type="text" value="${esc(kw.thumbnail_url||'')}" onchange="keywords[${i}].thumbnail_url=this.value">
                </div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="keywords.splice(${i},1);render()">Supprimer</button>
        </div>
    `).join('');
}

function addKeyword() {
    keywords.push({triggers:[],title:'',description:'',color:'',fields:[],footer:'',image_url:'',thumbnail_url:''});
    render();
}

async function saveKeywords() {
    const res = await authFetch('/api/keywords', {method:'POST', body: keywords});
    if (res && res.ok) showToast('Keywords sauvegardés !');
    else showToast('Erreur lors de la sauvegarde', 'error');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
load();
</script>
{% endblock %}
