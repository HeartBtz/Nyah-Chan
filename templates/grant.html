{% extends "base.html" %}
{% block title %}Grant — Nyah-Chan{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Grant Commands</h1>
    <p>Commandes d'attribution de rôles personnalisées</p>
</div>

<div class="card">
    <div class="card-header">
        <h2>Commandes grant</h2>
        <button class="btn btn-primary btn-sm" onclick="addGrant()">+ Ajouter</button>
    </div>
    <div id="grant-list"></div>
    <div class="btn-group">
        <button class="btn btn-success" onclick="saveGrants()">Sauvegarder</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let grants = [];

async function load() {
    const res = await authFetch('/api/grant');
    if (!res) return;
    grants = await res.json();
    render();
}

function render() {
    const el = document.getElementById('grant-list');
    if (!grants.length) {
        el.innerHTML = '<div class="empty-state"><p>Aucune commande grant configurée.</p></div>';
        return;
    }
    el.innerHTML = grants.map((g, i) => `
        <div class="card" style="margin-bottom:0.75rem">
            <div class="form-row">
                <div class="form-group">
                    <label>Nom de la commande</label>
                    <input type="text" value="${esc(g.name||'')}" onchange="grants[${i}].name=this.value">
                </div>
                <div class="form-group">
                    <label>Rôle à attribuer</label>
                    <input type="text" value="${esc(g.role_name||'')}" onchange="grants[${i}].role_name=this.value">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>IDs autorisés (virgule séparés)</label>
                    <input type="text" value="${(g.allowed_user_ids||[]).join(', ')}"
                        onchange="grants[${i}].allowed_user_ids=this.value.split(',').map(s=>s.trim()).filter(Boolean)">
                </div>
                <div class="form-group">
                    <label>GIF (chemin ou URL)</label>
                    <input type="text" value="${esc(g.gif_path||'')}" onchange="grants[${i}].gif_path=this.value">
                </div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="grants.splice(${i},1);render()">Supprimer</button>
        </div>
    `).join('');
}

function addGrant() {
    grants.push({name:'',role_name:'',allowed_user_ids:[],gif_path:''});
    render();
}

async function saveGrants() {
    const res = await authFetch('/api/grant', {method:'POST', body: grants});
    if (res && res.ok) showToast('Grant commands sauvegardées !');
    else showToast('Erreur', 'error');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
load();
</script>
{% endblock %}
