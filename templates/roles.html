{% extends "base.html" %}
{% block title %}Rôles — Nyah-Chan{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Role Triggers</h1>
    <p>Attribution automatique de rôles par mots-clés</p>
</div>

<div class="card">
    <div class="card-header">
        <h2>Triggers de rôles</h2>
        <button class="btn btn-primary btn-sm" onclick="addTrigger()">+ Ajouter</button>
    </div>
    <div class="table-container" id="rt-table-wrap">
        <table class="data-table">
            <thead><tr>
                <th>Mot déclencheur</th>
                <th>Rôle</th>
                <th>Mot de retrait</th>
                <th></th>
            </tr></thead>
            <tbody id="rt-body"></tbody>
        </table>
    </div>
    <div class="btn-group">
        <button class="btn btn-success" onclick="saveTriggers()">Sauvegarder</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let triggers = [];

async function load() {
    const res = await authFetch('/api/roles');
    if (!res) return;
    triggers = await res.json();
    render();
}

function render() {
    const tb = document.getElementById('rt-body');
    if (!triggers.length) {
        tb.innerHTML = '<tr><td colspan="4" class="text-muted" style="text-align:center;padding:2rem">Aucun trigger configuré.</td></tr>';
        return;
    }
    tb.innerHTML = triggers.map((t, i) => `<tr>
        <td><input type="text" value="${esc(t.trigger_word||'')}" onchange="triggers[${i}].trigger_word=this.value"></td>
        <td><input type="text" value="${esc(t.role_name||'')}" onchange="triggers[${i}].role_name=this.value"></td>
        <td><input type="text" value="${esc(t.remove_trigger||'')}" onchange="triggers[${i}].remove_trigger=this.value"></td>
        <td><button class="btn btn-danger btn-sm" onclick="triggers.splice(${i},1);render()">×</button></td>
    </tr>`).join('');
}

function addTrigger() {
    triggers.push({trigger_word:'',role_name:'',remove_trigger:''});
    render();
}

async function saveTriggers() {
    const res = await authFetch('/api/roles', {method:'POST', body: triggers});
    if (res && res.ok) showToast('Triggers sauvegardés !');
    else showToast('Erreur', 'error');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
load();
</script>
{% endblock %}
