{% extends "base.html" %}
{% block title %}Warnings — Nyah-Chan{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Avertissements</h1>
    <p>Historique des warnings du serveur</p>
</div>

<div class="card">
    <div class="card-header">
        <h2>Warnings</h2>
        <span class="badge" id="w-count">0</span>
    </div>
    <div class="table-container">
        <table class="data-table">
            <thead><tr>
                <th>#</th>
                <th>Utilisateur</th>
                <th>Modérateur</th>
                <th>Raison</th>
                <th>Date</th>
                <th></th>
            </tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function load() {
    const res = await authFetch('/api/warnings');
    if (!res) return;
    const warnings = await res.json();
    document.getElementById('w-count').textContent = warnings.length;
    const tb = document.getElementById('w-body');
    if (!warnings.length) {
        tb.innerHTML = '<tr><td colspan="6" class="text-muted" style="text-align:center;padding:2rem">Aucun avertissement.</td></tr>';
        return;
    }
    tb.innerHTML = warnings.map(w => `<tr>
        <td><code>#${w.id}</code></td>
        <td><code>${w.user_id}</code></td>
        <td><code>${w.moderator_id}</code></td>
        <td>${esc(w.reason)}</td>
        <td class="text-muted text-sm">${w.created_at}</td>
        <td><button class="btn btn-danger btn-sm" onclick="removeWarn(${w.id})">×</button></td>
    </tr>`).join('');
}

async function removeWarn(id) {
    if (!confirm('Supprimer le warning #' + id + ' ?')) return;
    const res = await authFetch('/api/warnings/' + id, {method:'DELETE'});
    if (res && res.ok) { showToast('Warning supprimé'); load(); }
    else showToast('Erreur', 'error');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
load();
</script>
{% endblock %}
